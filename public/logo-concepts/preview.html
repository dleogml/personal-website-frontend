<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unbox Korea logo concepts</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#202322;color:#f8f5ee;font:16px Arial,sans-serif}.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.option{margin:0;padding:12px;background:#111719;border:1px solid #434947;border-radius:12px}.option img{display:block;width:100%;height:auto}.option figcaption{padding:10px 6px 2px;color:#e8ddd0;font-size:15px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
<main class="grid">
<figure class="option"><img src="option-1-hat-mask-palace.svg"><figcaption>Option 1 · Gat, Hahoe mask and Gyeongbokgung</figcaption></figure>
<figure class="option"><img src="option-2-janggu-fan.svg"><figcaption>Option 2 · Janggu and folding fan</figcaption></figure>
<figure class="option"><img src="option-3-tiger-magpie.svg"><figcaption>Option 3 · Folk art tiger and magpie</figcaption></figure>
<figure class="option"><img src="option-4-hanbok-knot.svg"><figcaption>Option 4 · Hanbok and norigae</figcaption></figure>
<figure class="option"><img src="option-5-namsan-tower.svg"><figcaption>Option 5 · Namsan Tower and Seoul mountains</figcaption></figure>
</main></html>
